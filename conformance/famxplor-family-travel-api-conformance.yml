domain_standard:
  market: travel / tourism content and points of interest
  declared: false
  detail: >-
    REWARD-ONLY, and honestly empty. Nothing in the contract declares a travel-domain
    standard — no OTA/OpenTravel message type, no GDS shape, no schema.org TouristAttraction
    or Place vocabulary in the response schemas, no OGC/GeoJSON geometry (coordinates are
    bare lat/lon numbers rather than a GeoJSON Point). The nearest thing to a domain standard
    the API does use is ISO 639 language codes on Accept-Language, recorded above. A caller
    integrating Famxplor alongside any other POI source writes a bespoke mapping.
