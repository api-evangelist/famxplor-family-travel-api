  pricing page on 2026-09-07. This REPLACES the 2026-05-04 bulk-sweep scaffold, whose free
  tier, request quotas and per-minute limits were placeholder values the provider never
  published. Famxplor sells four tiers, all metered on monthly API calls; there is no free
  tier — the entry point is a 14-day trial with no card, after which the cheapest plan is
  $4.99/month for 200 calls.
