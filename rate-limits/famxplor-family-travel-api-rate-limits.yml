specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Famxplor Family Travel API
providerId: famxplor-family-travel-api
created: '2026-05-04'
modified: '2026-09-07'
generated: '2026-09-07'
method: searched
source: https://famxplor.com/pricing
probe:
  documented: https://famxplor.com/pricing
  observed: 'POST https://api.famxplor.com/v1/nearest-activities (unauthenticated), 2026-09-07'
description: >-
  Rate limits for the Famxplor Family Travel API as the provider actually publishes them.
  This REPLACES the 2026-05-04 bulk-sweep scaffold, which asserted X-RateLimit-* response
  headers, per-minute ceilings, burst allowances and a 429 code that Famxplor has never
  documented and does not return. What the provider genuinely publishes is a MONTHLY CALL
  QUOTA per plan and nothing else.
tags:
  - Activities
  - Family
  - Travel
  - AI
  - MCP
  - Rate Limiting
  - Quotas
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    No rate-limit headers are documented, and none were returned on a live unauthenticated
    request — the response carried only content-type, date, server (uvicorn) and
    content-length. A running agent therefore has NO runtime signal of how much of its
    monthly quota remains; it can only count its own calls.
responseCodes:
  throttled: null
  quotaExceeded: null
  note: >-
    Undocumented. The OpenAPI declares no 429 on any operation and the pricing page does not
    say whether an exhausted quota returns an error, throttles, or bills as overage.
limit_count: 4
limits:
  - tier: starter
    name: Starter monthly quota
    scope: api-key
    metric: requests_per_month
    limit: 200
    timeFrame: month
    price: '4.99 USD/month'
    source: https://famxplor.com/pricing
    applies: [Famxplor Family Travel API]
  - tier: pro
    name: Pro monthly quota
    scope: api-key
    metric: requests_per_month
    limit: 1000
    timeFrame: month
    price: '24.99 USD/month'
    source: https://famxplor.com/pricing
    applies: [Famxplor Family Travel API]
  - tier: business
    name: Business monthly quota
    scope: api-key
    metric: requests_per_month
    limit: 5000
    timeFrame: month
    price: '124.99 USD/month'
    source: https://famxplor.com/pricing
    applies: [Famxplor Family Travel API]
  - tier: enterprise
    name: Enterprise negotiated volume
    scope: contract
    metric: requests_per_month
    limit: null
    timeFrame: month
    price: custom
    source: https://famxplor.com/pricing
    note: '"Tailored API Call Volume" — not published'
    applies: [Famxplor Family Travel API]
response_size_limits:
  - operation: nearest_posts_v1_nearest_posts_post
    max_results: 100
    source: 'OpenAPI description — "Maximum results per request: 100 posts."'
  - operation: nearest_activities_v1_nearest_activities_post
    max_results: 100
    source: 'OpenAPI description — "Maximum results per request: 100 activities."'
input_limits:
  - parameter: max_distance
    max: 100000
    unit: metres
    default: 1000
    source: '#/components/schemas/NearestInput'
policies: []
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
