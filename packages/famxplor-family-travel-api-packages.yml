finding: >-
  Famxplor ships NO client library in any language. The developer surface is the raw REST
  contract plus a Swagger UI / ReDoc pair; info.description tells integrators to import
  https://api.famxplor.com/openapi.json into Postman rather than pointing at an SDK. The one
  installable first-party artifact is the MCP server, distributed only as a git clone — it is
  published to no registry, so a consumer cannot pin a version of it either.
