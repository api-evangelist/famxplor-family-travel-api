finding: >-
  No status page, no changelog, no deprecation policy and no roadmap. For a paid API whose
  cheapest tier is $4.99/month this is the largest single operational gap in the profile:
  a consumer has no published way to learn that the API is down, that it changed, or that an
  operation is going away.
